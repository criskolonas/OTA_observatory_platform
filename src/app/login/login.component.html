<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" formControlName="email" class="form-control" placeholder="Enter your email" />
    <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="error">
      A valid email is required.
    </div>
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" formControlName="password" class="form-control" placeholder="Enter your password" />
    <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="error">
      Password is required.
    </div>
  </div>

  <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Login</button>

  <div *ngIf="errorMessage" class="error-message mt-3">
    <p>{{ errorMessage }}</p>
  </div>

</form>
